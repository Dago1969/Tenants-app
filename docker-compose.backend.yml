services:
  mysql:
    image: mysql:8.0
    container_name: tenants-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: dago
      MYSQL_DATABASE: QTMTenant_${APP_KEYCLOAK_REALM_CODE}
    volumes:
      - tenants-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pdago --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - tenants-network

  tenants-backend:
    image: tenants-app-backend:latest
    build:
      context: ..
      dockerfile: Tenants-app/Dockerfile
      args:
        SPRING_PROFILES_ACTIVE: collaudo
    container_name: tenants-backend
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8087:8080"
    env_file:
      - ../Tenants-app/.env
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8085/realms/${APP_KEYCLOAK_REALM_CODE}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # volumes:
    #   - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - tenants-network
      - keycloak-net

# Questo file docker-compose è pensato per avviare solo il backend Spring Boot.
# Assicurati che il Dockerfile sia presente nella root e che esponga la porta 8080.
# Modifica SPRING_PROFILES_ACTIVE secondo le tue esigenze.

volumes:
  tenants-mysql-data:
    driver: local

networks:
  tenants-network:
    driver: bridge
  keycloak-net:
    external: true
    name: keycloak-docker_default # Sostituisci con il nome reale della rete esterna
