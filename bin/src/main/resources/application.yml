server:
  port: 8087

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:QTMTenant}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        '[format_sql]': true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: //${APP_KEYCLOAK_SERVER_URL:http:localhost:8085}/realms/${APP_KEYCLOAK_REALM_CODE:QTM}

logging:
  level:
    root: INFO

qtm:
  dashboard:
    api-base-url: http://localhost:8086/api
