<div class="form-container">
  <div class="header">
    <h2>{{ 'appointment.title.create' | translate }}</h2>
  </div>

  <!-- Messaggi errore/successo -->
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>
  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="loading">
    {{ 'crud.loading' | translate }}
  </div>

  <form (ngSubmit)="submitForm()" [ngClass]="{ loading: saving }">
    <!-- Tipo Appuntamento -->
    <div class="form-group">
      <label for="appointmentType">{{ 'appointment.field.type' | translate }} <span class="required">*</span></label>
      <select 
        id="appointmentType" 
        [(ngModel)]="form.appointmentTypeId" 
        (change)="onAppointmentTypeChange()"
        name="appointmentTypeId" 
        class="form-control"
        [disabled]="loading || saving">
        <option value="null" selected disabled>{{ 'appointment.placeholder.selectType' | translate }}</option>
        <option *ngFor="let type of appointmentTypes" [value]="type.id">
          {{ type.name }} ({{ type.durationMinutes }}min)
        </option>
      </select>
    </div>

    <!-- Infermiere -->
    <div class="form-group">
      <label for="nurse">{{ 'appointment.field.nurse' | translate }} <span class="required">*</span></label>
      <select 
        id="nurse" 
        [(ngModel)]="form.nurseId" 
        name="nurseId" 
        class="form-control"
        [disabled]="loading || saving">
        <option value="null" selected disabled>{{ 'appointment.placeholder.selectNurse' | translate }}</option>
        <option *ngFor="let nurse of planNurses" [value]="nurse.id">
          {{ nurse.fullName }}
        </option>
      </select>
    </div>

    <!-- Data/Ora Inizio -->
    <div class="form-group">
      <label for="startDateTime">{{ 'appointment.field.startDateTime' | translate }} <span class="required">*</span></label>
      <input 
        type="datetime-local" 
        id="startDateTime" 
        [(ngModel)]="form.startDateTime" 
        (change)="onStartDateTimeChange()"
        name="startDateTime" 
        class="form-control"
        [disabled]="loading || saving" />
    </div>

    <!-- Ora Fine (calcolata automaticamente) -->
    <div class="form-group">
      <label for="endDateTime">{{ 'appointment.field.endDateTime' | translate }}</label>
      <input 
        type="datetime-local" 
        id="endDateTime" 
        [value]="estimatedEndTime" 
        class="form-control" 
        disabled />
      <small class="form-text">{{ 'appointment.help.estimatedEnd' | translate }}</small>
    </div>

    <!-- Ricorrenza -->
    <div class="form-group">
      <label for="recurrence">{{ 'appointment.field.recurrence' | translate }} <span class="required">*</span></label>
      <select 
        id="recurrence" 
        [(ngModel)]="form.recurrenceType" 
        name="recurrenceType" 
        class="form-control"
        [disabled]="loading || saving">
        <option *ngFor="let type of recurrenceTypes" [value]="type.value">
          {{ type.label | translate }}
        </option>
      </select>
    </div>

    <!-- Data Fine Ricorrenza (solo se ricorrente) -->
    <div *ngIf="isRecurrent()" class="form-group">
      <label for="recurrenceEndDate">{{ 'appointment.field.recurrenceEndDate' | translate }} <span class="required">*</span></label>
      <input 
        type="date" 
        id="recurrenceEndDate" 
        [(ngModel)]="form.recurrenceEndDate" 
        name="recurrenceEndDate" 
        class="form-control"
        [disabled]="loading || saving" />
    </div>

    <!-- Promemoria -->
    <div class="form-group">
      <label class="checkbox-label">
        <input 
          type="checkbox" 
          [(ngModel)]="form.reminderEnabled" 
          name="reminderEnabled"
          [disabled]="loading || saving" />
        {{ 'appointment.field.reminderEnabled' | translate }}
      </label>
    </div>

    <!-- Minuti prima promemoria -->
    <div *ngIf="form.reminderEnabled" class="form-group">
      <label for="reminderMinutes">{{ 'appointment.field.reminderMinutesBefore' | translate }}</label>
      <input 
        type="number" 
        id="reminderMinutes" 
        [(ngModel)]="form.reminderMinutesBefore" 
        name="reminderMinutesBefore" 
        class="form-control"
        min="1"
        [disabled]="loading || saving" />
    </div>

    <!-- Note -->
    <div class="form-group">
      <label for="notes">{{ 'appointment.field.notes' | translate }}</label>
      <textarea 
        id="notes" 
        [(ngModel)]="form.notes" 
        name="notes" 
        class="form-control"
        rows="3"
        [disabled]="loading || saving"></textarea>
    </div>

    <!-- Bottoni -->
    <div class="form-actions">
      <button type="submit" class="btn-primary" [disabled]="loading || saving">
        {{ saving ? ('crud.saving' | translate) : ('appointment.button.create' | translate) }}
      </button>
      <button type="button" (click)="resetForm()" class="btn-secondary" [disabled]="loading || saving">
        {{ 'crud.reset' | translate }}
      </button>
    </div>
  </form>
</div>
