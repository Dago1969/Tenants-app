<qtm-step-modal
  [title]="translate(titleKey)"
  [step]="currentStepIndex + 1"
  [totalSteps]="steps.length"
  [stepTitle]="translate(currentStep.title)"
  [stepDescription]="translate(currentStep.description)"
  (close)="cancel()"
>
  <div class="therapeutic-plan-shell" *ngIf="!loading; else loadingState">
    <div *ngIf="errorMessage && (currentStep.key !== 'main' || !formModel.drugCode)" class="therapeutic-plan-alert therapeutic-plan-alert-error">
      {{ errorMessage }}
    </div>

    <section *ngIf="currentStep.key === 'main'" class="therapeutic-plan-grid">
      <label class="therapeutic-plan-field">
        <span>{{ translate('therapeuticPlan.field.patient') }}</span>
        <select [(ngModel)]="formModel.patientId">
          <option [ngValue]="null"></option>
          <option *ngFor="let patient of patients" [ngValue]="patient.id">
            {{ getPatientLabel(patient) }}
          </option>
        </select>
      </label>

      <label class="therapeutic-plan-field">
        <span>{{ translate('therapeuticPlan.field.projectCode') }}</span>
        <input [(ngModel)]="formModel.projectCode" type="text" readonly />
      </label>

      <label class="therapeutic-plan-field">
        <span>{{ translate('therapeuticPlan.field.status') }}</span>
        <select [(ngModel)]="formModel.status">
          <option *ngFor="let option of statusOptions" [value]="option.value">
            {{ translate(option.labelKey) }}
          </option>
        </select>
      </label>

      <label class="therapeutic-plan-field">
        <span>{{ translate('therapeuticPlan.field.medicine') }}</span>
        <select [(ngModel)]="formModel.drugCode">
          <option [ngValue]="''">{{ translate('therapeuticPlan.field.medicinePlaceholder') }}</option>
          <option *ngFor="let med of medicineOptions" [ngValue]="med.value">
            {{ med.label }}
          </option>
        </select>
        <small class="therapeutic-plan-field-help">{{ medicineSelectionInfo }}</small>
      </label>
    </section>

    <section *ngIf="currentStep.key === 'clinical'" class="therapeutic-plan-grid">
      <label class="therapeutic-plan-field therapeutic-plan-field-full">
        <span>{{ translate('therapeuticPlan.field.structure') }}</span>
        <select [(ngModel)]="formModel.structureId">
          <option [ngValue]="null"></option>
          <option *ngFor="let structure of structures" [ngValue]="structure.id">
            {{ getStructureLabel(structure) }}
          </option>
        </select>
      </label>

      <div *ngIf="selectedStructure" class="therapeutic-plan-inline-hint therapeutic-plan-field-full">
        {{ translate('therapeuticPlan.field.structureType') }}: {{ selectedStructure.structureType }}
      </div>

      <label class="therapeutic-plan-field">
        <span>{{ translate('therapeuticPlan.field.nurse') }}</span>
        <select [(ngModel)]="formModel.nurseId">
          <option [ngValue]="null"></option>
          <option *ngFor="let nurse of nurses" [ngValue]="nurse.id">
            {{ nurse.fullName }}
          </option>
        </select>
      </label>

      <label class="therapeutic-plan-field">
        <span>{{ translate('therapeuticPlan.field.doctor') }}</span>
        <select [(ngModel)]="formModel.doctorId">
          <option [ngValue]="null"></option>
          <option *ngFor="let doctor of doctors" [ngValue]="doctor.id">
            {{ doctor.fullName }}
          </option>
        </select>
      </label>
    </section>

    <section *ngIf="currentStep.key === 'equipment'" class="therapeutic-plan-equipment-step">
      <div class="therapeutic-plan-inline-hint">
        {{ translate('therapeuticPlan.equipment.available') }}: {{ selectedEquipmentCount }}
      </div>

      <div *ngIf="visibleEquipmentOptions.length === 0" class="therapeutic-plan-alert therapeutic-plan-alert-info">
        {{ translate('therapeuticPlan.equipment.empty') }}
      </div>

      <div class="therapeutic-plan-equipment-grid" *ngIf="visibleEquipmentOptions.length > 0">
        <button
          type="button"
          class="therapeutic-plan-equipment-card"
          *ngFor="let equipment of visibleEquipmentOptions"
          [class.therapeutic-plan-equipment-card-selected]="isEquipmentSelected(equipment.id)"
          (click)="toggleEquipment(equipment.id)"
        >
          <span class="therapeutic-plan-equipment-code">{{ equipment.code }}</span>
          <span class="therapeutic-plan-equipment-detail">{{ equipment.equipmentTypeName || '-' }}</span>
          <span class="therapeutic-plan-equipment-detail">{{ equipment.serialNumber || '-' }}</span>
          <span class="therapeutic-plan-equipment-status">{{ translate('status.' + equipment.status) }}</span>
        </button>
      </div>
    </section>

    <section *ngIf="currentStep.key === 'schedule'" class="therapeutic-plan-grid">
      <label class="therapeutic-plan-field">
        <span>{{ translate('therapeuticPlan.field.startDate') }}</span>
        <input [(ngModel)]="formModel.startDate" type="date" />
      </label>

      <label class="therapeutic-plan-field">
        <span>{{ translate('therapeuticPlan.field.endDate') }}</span>
        <input [(ngModel)]="formModel.endDate" type="date" />
      </label>

      <label class="therapeutic-plan-field therapeutic-plan-field-full">
        <span>{{ translate('therapeuticPlan.field.notes') }}</span>
        <textarea [(ngModel)]="formModel.notes" rows="5"></textarea>
      </label>
    </section>
  </div>

  <ng-template #loadingState>
    <div class="therapeutic-plan-loading">{{ translate('therapeuticPlan.state.loading') }}</div>
  </ng-template>

  <div modal-actions class="therapeutic-plan-actions">
    <button type="button" class="therapeutic-plan-btn therapeutic-plan-btn-secondary" (click)="cancel()">
      {{ translate('crud.actions.cancel') }}
    </button>
    <button *ngIf="!isFirstStep" type="button" class="therapeutic-plan-btn therapeutic-plan-btn-secondary" (click)="previousStep()">
      {{ translate('projects.wizard.actions.previous') }}
    </button>
    <button *ngIf="!isLastStep" type="button" class="therapeutic-plan-btn therapeutic-plan-btn-primary" (click)="nextStep()">
      {{ translate('crud.actions.next') }}
    </button>
    <button *ngIf="isLastStep" type="button" class="therapeutic-plan-btn therapeutic-plan-btn-primary" [disabled]="saving" (click)="save()">
      {{ translate(therapeuticPlanId === null ? 'crud.actions.create' : 'crud.actions.update') }}
    </button>
  </div>
</qtm-step-modal>
