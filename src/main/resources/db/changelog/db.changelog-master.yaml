  - changeSet:
      id: 2026-04-14-align-module-role-authorizations-schema
      author: copilot
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - and:
            - tableExists:
                tableName: module_role_authorizations
            - columnExists:
                tableName: module_role_authorizations
                columnName: module_id
            - columnExists:
                tableName: module_role_authorizations
                columnName: function_id
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              ALTER TABLE module_role_authorizations
                MODIFY COLUMN module_id BIGINT NULL,
                MODIFY COLUMN function_id BIGINT NULL;

              ALTER TABLE module_role_authorizations
                DROP INDEX uq_module_role_authorizations;

              ALTER TABLE module_role_authorizations
                ADD UNIQUE INDEX uq_module_role_authorizations_code_role (module_code, role_id);

