        - onFail: MARK_RAN
        - onError: HALT
        - not:
            columnExists:
              tableName: module_role_authorizations
              columnName: module_code
      changes:
        - sqlFile:
            path: ../manual-migrations/2026-03-06-module-code-key.sql
            relativeToChangelogFile: true
            splitStatements: true
