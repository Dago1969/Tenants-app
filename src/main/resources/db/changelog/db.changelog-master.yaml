  - changeSet:
      id: 2026-04-14-create-modules
      author: copilot
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - not:
            tableExists:
              tableName: modules
      changes:
        - createTable:
            tableName: modules
            columns:
              - column:
                  name: id
                  type: BIGINT UNSIGNED AUTO_INCREMENT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
            remarks: Tabella dei moduli applicativi
  - changeSet:
      id: 2026-04-14-create-module-role-authorizations
      author: copilot
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - not:
            tableExists:
              tableName: module_role_authorizations
      changes:
        - createTable:
            tableName: module_role_authorizations
            columns:
              - column:
                  name: id
                  type: BIGINT UNSIGNED AUTO_INCREMENT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: module_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: function_id
                  type: BIGINT
                  constraints:
                    nullable: false
            remarks: Tabella di autorizzazione ruolo-funzione-modulo
        - addUniqueConstraint:
            tableName: module_role_authorizations
            columnNames: module_id, role_id, function_id
            constraintName: uq_module_role_authorizations

  # ATTENZIONE: Per supportare la creazione di un nuovo DB da zero,
  # inserire qui come primo changeset uno script SQL che contenga tutte le CREATE TABLE base.
  # Esempio: esporta lo schema da un DB funzionante con mysqldump --no-data > schema-base.sql
  # Sostituisci il path con quello reale e popola lo script.
  - changeSet:
      id: 2026-04-14-schema-base
      author: copilot
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - not:
            tableExists:
              tableName: roles
      changes:
        - sqlFile:
            path: ../manual-migrations/schema-base.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: false

