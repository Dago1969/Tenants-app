  - changeSet:
      id: 2026-04-16-create-equipment-table
      author: copilot
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - not:
            tableExists:
              tableName: equipment
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              CREATE TABLE IF NOT EXISTS equipment (
                id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
                equipment_type_id BIGINT UNSIGNED NOT NULL,
                code VARCHAR(64) NOT NULL UNIQUE,
                status VARCHAR(32) NOT NULL DEFAULT 'in_magazzino',
                serial_number VARCHAR(128),
                location VARCHAR(255),
                assigned_to VARCHAR(255),
                purchase_date DATE,
                last_revision_date DATE,
                next_revision_date DATE,
                notes VARCHAR(1000),
                primary_json TEXT,
                secondary_json TEXT,
                created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                CONSTRAINT fk_equipment_equipment_type
                  FOREIGN KEY (equipment_type_id) REFERENCES equipment_type (id)
              );

              CREATE INDEX idx_equipment_type_id ON equipment (equipment_type_id);
              CREATE INDEX idx_equipment_status ON equipment (status);