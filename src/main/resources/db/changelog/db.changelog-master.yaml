databaseChangeLog:
  - changeSet:
      id: 20260415-01-create-equipment-type-table
      author: copilot
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - not:
            tableExists:
              tableName: equipment_type
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              CREATE TABLE IF NOT EXISTS equipment_type (
                id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
                code VARCHAR(64) NOT NULL UNIQUE,
                name VARCHAR(128) NOT NULL,
                description VARCHAR(512),
                equipment_use VARCHAR(256),
                cost DECIMAL(19,2),
                supplier VARCHAR(128),
                serial_number_required BIT,
                principal_json_present BIT,
                principal_json_path VARCHAR(256),
                secondary_json_present BIT,
                secondary_json_path VARCHAR(256),
                purchase_date DATE,
                status VARCHAR(32),
                created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP
              );
  - changeSet:
      id: 20260415-02-rename-equipment-type-use-column
      author: copilot
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - tableExists:
            tableName: equipment_type
        - columnExists:
            tableName: equipment_type
            columnName: use
        - not:
            columnExists:
              tableName: equipment_type
              columnName: equipment_use
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              ALTER TABLE equipment_type
                CHANGE COLUMN `use` equipment_use VARCHAR(256);
  - changeSet:
      id: 2026-04-14-create-base-tables
      author: copilot
      validCheckSum:
        - 9:1d43b9313aca899264436c48ab6812d7
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              CREATE TABLE IF NOT EXISTS structures (
                id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
                code VARCHAR(255) UNIQUE,
                name VARCHAR(255) NOT NULL,
                description VARCHAR(255),
                address VARCHAR(255) NOT NULL,
                cap VARCHAR(255),
                city_id BIGINT,
                city VARCHAR(255),
                province_id BIGINT,
                province VARCHAR(255),
                region_id BIGINT,
                region VARCHAR(255),
                phone VARCHAR(255),
                email VARCHAR(255),
                service_calendar_hours TEXT,
                active BIT,
                structure_type VARCHAR(255),
                parent_structure_id BIGINT
              );

              CREATE TABLE IF NOT EXISTS structure_types (
                code VARCHAR(255) PRIMARY KEY,
                description VARCHAR(255) NOT NULL,
                function_description VARCHAR(1000) NOT NULL,
                parent_type_code VARCHAR(255),
                display_order INT NOT NULL
              );

              CREATE TABLE IF NOT EXISTS referents (
                id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
                first_name VARCHAR(255) NOT NULL,
                last_name VARCHAR(255) NOT NULL,
                role VARCHAR(255),
                phone VARCHAR(255),
                email VARCHAR(255)
              );

              CREATE TABLE IF NOT EXISTS structure_referents (
                structure_id BIGINT UNSIGNED NOT NULL,
                referent_id BIGINT UNSIGNED NOT NULL,
                PRIMARY KEY (structure_id, referent_id)
              );

              CREATE TABLE IF NOT EXISTS structure_pharmacies (
                structure_id BIGINT UNSIGNED NOT NULL,
                pharmacy_id BIGINT UNSIGNED NOT NULL,
                PRIMARY KEY (structure_id, pharmacy_id)
              );

              CREATE TABLE IF NOT EXISTS modules (
                code VARCHAR(255) PRIMARY KEY,
                name VARCHAR(255) NOT NULL
              );

              CREATE TABLE IF NOT EXISTS roles (
                id VARCHAR(255) PRIMARY KEY,
                name VARCHAR(255) NOT NULL,
                description VARCHAR(255) NOT NULL
              );

              CREATE TABLE IF NOT EXISTS functions (
                code VARCHAR(255) PRIMARY KEY,
                name VARCHAR(255) NOT NULL
              );

              CREATE TABLE IF NOT EXISTS controller_method_functions (
                id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
                module_code VARCHAR(100) NOT NULL,
                method_name VARCHAR(150) NOT NULL,
                function_code VARCHAR(100) NOT NULL,
                UNIQUE KEY uk_controller_method_function (module_code, method_name)
              );

              CREATE TABLE IF NOT EXISTS module_role_authorizations (
                id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
                module_code VARCHAR(255) NOT NULL,
                role_id VARCHAR(255) NOT NULL,
                authorization VARCHAR(255) NOT NULL,
                UNIQUE KEY uk_module_role_authorizations_module_code_role (module_code, role_id)
              );

              CREATE TABLE IF NOT EXISTS field_authorizations (
                id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
                module_role_authorization_id BIGINT NOT NULL,
                entity_name VARCHAR(255) NOT NULL,
                field_name VARCHAR(255) NOT NULL,
                authorization VARCHAR(255) NOT NULL,
                UNIQUE KEY uk_field_authorizations_module_role_entity_field (module_role_authorization_id, entity_name, field_name)
              );

              CREATE TABLE IF NOT EXISTS function_module_role_authorizations (
                id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
                function_code VARCHAR(255) NOT NULL,
                module_code VARCHAR(255) NOT NULL,
                role_id VARCHAR(255) NOT NULL,
                authorization VARCHAR(255) NOT NULL,
                UNIQUE KEY uk_fmra_func_mod_role (function_code, module_code, role_id)
              );

              CREATE TABLE IF NOT EXISTS patients (
                id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
                assisted_id VARCHAR(255) UNIQUE,
                first_name VARCHAR(255) NOT NULL,
                last_name VARCHAR(255) NOT NULL,
                fiscal_code VARCHAR(255) NOT NULL UNIQUE,
                email VARCHAR(255),
                primary_phone VARCHAR(255),
                secondary_phone VARCHAR(255),
                region_id BIGINT,
                region VARCHAR(255),
                province_id BIGINT,
                province VARCHAR(255),
                city_id BIGINT,
                city VARCHAR(255),
                delivery_address VARCHAR(255),
                secondary_addresses VARCHAR(2000),
                communication_channels VARCHAR(255),
                identification_document_reference VARCHAR(2000),
                data_processing_consent BIT,
                data_processing_consent_datetime DATETIME,
                data_processing_consent_revocation_log VARCHAR(4000),
                additional_consents VARCHAR(2000),
                therapy_status VARCHAR(255),
                prescribing_specialist VARCHAR(255),
                reference_hospital_structure VARCHAR(255),
                reference_pharmacy VARCHAR(255),
                preferred_pickup_pharmacy VARCHAR(255),
                delivery_mode VARCHAR(255),
                reminder_enabled BIT,
                caregiver_full_name VARCHAR(255),
                caregiver_phone VARCHAR(255),
                preferred_contact VARCHAR(255),
                structure_id BIGINT
              );

              CREATE TABLE IF NOT EXISTS doctors (
                id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
                doctor_flyer_id VARCHAR(255) UNIQUE,
                full_name VARCHAR(255) NOT NULL,
                email VARCHAR(255),
                primary_phone VARCHAR(255),
                secondary_phone VARCHAR(255),
                region_id BIGINT,
                region VARCHAR(255),
                province_id BIGINT,
                province VARCHAR(255),
                city_id BIGINT,
                city VARCHAR(255),
                delivery_address VARCHAR(255),
                secondary_addresses VARCHAR(2000),
                structure_id BIGINT,
                specialization VARCHAR(255),
                data_processing_consent BIT,
                data_processing_consent_datetime DATETIME,
                data_processing_consent_revocation_log VARCHAR(4000),
                additional_consents VARCHAR(2000)
              );

              CREATE TABLE IF NOT EXISTS nurses (
                id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
                nurse_project_id VARCHAR(255) UNIQUE,
                full_name VARCHAR(255) NOT NULL,
                email VARCHAR(255),
                primary_phone VARCHAR(255),
                secondary_phone VARCHAR(255),
                region_id BIGINT,
                region VARCHAR(255),
                province_id BIGINT,
                province VARCHAR(255),
                city_id BIGINT,
                city VARCHAR(255),
                coverage_area VARCHAR(255),
                reference_provider VARCHAR(255),
                professional_register VARCHAR(255),
                enabled BIT
              );

              CREATE TABLE IF NOT EXISTS operation_logs (
                id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
                occurred_at DATETIME NOT NULL,
                module_code VARCHAR(255) NOT NULL,
                function_code VARCHAR(255),
                operation VARCHAR(255) NOT NULL,
                description TEXT,
                target_id VARCHAR(255),
                role_id VARCHAR(255),
                username VARCHAR(255) NOT NULL,
                client_ip VARCHAR(255),
                user_agent TEXT,
                metadata TEXT
              );

