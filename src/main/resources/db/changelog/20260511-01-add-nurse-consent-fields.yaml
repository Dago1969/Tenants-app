databaseChangeLog:
  - changeSet:
      id: 20260511-01-add-nurse-consent-fields
      author: copilot
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - tableExists:
            tableName: nurses
        - not:
            columnExists:
              tableName: nurses
              columnName: data_processing_consent
      changes:
        - addColumn:
            tableName: nurses
            columns:
              - column:
                  name: data_processing_consent
                  type: BIT

  - changeSet:
      id: 20260511-02-add-nurse-consent-datetime
      author: copilot
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - tableExists:
            tableName: nurses
        - not:
            columnExists:
              tableName: nurses
              columnName: data_processing_consent_datetime
      changes:
        - addColumn:
            tableName: nurses
            columns:
              - column:
                  name: data_processing_consent_datetime
                  type: DATETIME