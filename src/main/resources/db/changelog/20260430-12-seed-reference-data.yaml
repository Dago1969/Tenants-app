databaseChangeLog:
  - changeSet:
      id: 20260430-12-seed-structure-types
      author: copilot
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - tableExists:
            tableName: structure_types
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              INSERT IGNORE INTO structure_types (code, description, function_description, parent_type_code, display_order) VALUES
                ('ASL', 'Azienda Sanitaria Locale', 'Nodo capofila territoriale: raggruppa ospedali, farmacie e altre strutture, assicurando coerenza dei flussi e visibilita dati multi-tenant.', NULL, 10),
                ('HOSPITAL', 'Struttura Ospedaliera', 'Centro clinico dove si prescrivono e si monitorano i Piani Terapeutici; fa capo a una o piu farmacie ospedaliere.', 'ASL', 20),
                ('HOSPITAL_PHARMACY', 'Farmacia Ospedaliera', 'Hub logistico interno all''ospedale per preparazione e tracciabilita ordini.', 'HOSPITAL', 30),
                ('RETAIL_PHARMACY', 'Farmacia Retail', 'Punto di ritiro di prossimita o ultimo-miglio delivery nei progetti territoriali.', 'ASL', 40),
                ('LOGISTICS_WAREHOUSE', 'Magazzino Logistica', 'Deposito centrale esterno o interno che alimenta FO o FR; collegabile via API o WMS per stock real-time.', 'ASL', 50),
                ('MATERIAL_WAREHOUSE', 'Magazzino Materiale', 'Distribuzione interna di gadget, volantini e materiale monouso o promozionale.', 'ASL', 60),
                ('PHARMA_COMPANY', 'Azienda Farmaceutica', 'Ente promotore di progetti PSP, aderenza o delivery con interesse a KPI clinici, logistici e farmacovigilanza.', NULL, 70),
                ('SPECIALIST_CLINIC', 'Clinica Ambulatorio Specialistica', 'Struttura extra-ospedaliera che utilizza gli stessi flussi PT dell''ospedale per progetti cronici o PSP.', 'ASL', 80),
                ('VENDOR', 'Fornitore', 'Nodo organizzativo per aziende terze che forniscono beni o servizi essenziali alla delivery di un PSP, inclusi dispositivi, logistica, laboratori e personale infermieristico.', NULL, 90);

