databaseChangeLog:
  - changeSet:
      id: 20260517-01-create-therapeutic-plan-visit-image-table
      author: copilot
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - not:
            tableExists:
              tableName: therapeutic_plan_visit_image
      changes:
        - createTable:
            tableName: therapeutic_plan_visit_image
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: therapeutic_plan_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: visit_date
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: image_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: image_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: image_data
                  type: LONGBLOB
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: upload_date
                  type: DATETIME
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: therapeutic_plan_visit_image
            baseColumnNames: therapeutic_plan_id,visit_date
            referencedTableName: therapeutic_plan_visit
            referencedColumnNames: therapeutic_plan_id,visit_date
            constraintName: FK_visit_image_visit
            onDelete: CASCADE
