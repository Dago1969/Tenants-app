databaseChangeLog:
  - changeSet:
      id: 20261010-00-drop-fk-hospital-departments-structure
      author: copilot
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - foreignKeyConstraintExists:
            foreignKeyName: fk_hospital_departments_structure
            foreignKeyTableName: hospital_departments
      changes:
        - dropForeignKeyConstraint:
            baseTableName: hospital_departments
            constraintName: fk_hospital_departments_structure

