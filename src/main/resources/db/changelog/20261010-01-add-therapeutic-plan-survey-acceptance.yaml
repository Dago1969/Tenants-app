databaseChangeLog:
  - changeSet:
      id: 20261010-01-add-therapeutic-plan-survey-answers
      author: copilot
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        and:
          - tableExists:
              tableName: therapeutic_plan
          - not:
              columnExists:
                tableName: therapeutic_plan
                columnName: survey_answers
      changes:
        - addColumn:
            tableName: therapeutic_plan
            columns:
              - column:
                  name: survey_answers
                  type: TEXT
      rollback:
        - dropColumn:
            tableName: therapeutic_plan
            columnName: survey_answers
