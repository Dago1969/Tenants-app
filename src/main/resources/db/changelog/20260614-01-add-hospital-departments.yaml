databaseChangeLog:
  - changeSet:
      id: 20260614-01-add-hospital-departments
      author: copilot
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        preConditions:
          - not:
              tableExists:
                tableName: hospital_departments
      changes:
        - createTable:
            tableName: hospital_departments
            columns:
              - column:
                  name: id
                  type: BIGINT UNSIGNED
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: structure_id
                  type: BIGINT UNSIGNED
                  constraints:
                    nullable: false
              - column:
                  name: department_id
                  type: BIGINT UNSIGNED
                  constraints:
                    nullable: false
              - column:
                  name: referent_id
                  type: BIGINT UNSIGNED
                  constraints:
                    nullable: true
        - addUniqueConstraint:
            columnNames: structure_id,department_id
            constraintName: uq_hospital_departments_structure_department
            tableName: hospital_departments
        - addForeignKeyConstraint:
            baseTableName: hospital_departments
            baseColumnNames: structure_id
            referencedTableName: structures
            referencedColumnNames: id
            constraintName: fk_hospital_departments_structure
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: hospital_departments
            baseColumnNames: referent_id
            referencedTableName: referents
            referencedColumnNames: id
            constraintName: fk_hospital_departments_referent
            onDelete: SET NULL
