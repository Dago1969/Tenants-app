databaseChangeLog:
  - changeSet:
      id: 20260515-04-add-nurse-userid
      author: copilot
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - tableExists:
            tableName: nurses
        - not:
            columnExists:
              tableName: nurses
              columnName: userid
      changes:
        - addColumn:
            tableName: nurses
            columns:
              - column:
                  name: userid
                  type: VARCHAR(255)
                  remarks: "ID dell'utente associato (FK da QTMDB). Nullable per backward compatibility."
