databaseChangeLog:
  - changeSet:
      id: 20260615-01-remove-retail-parent-requirement
      author: copilot
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - tableExists:
            tableName: structure_types
        - sqlCheck:
            expectedResult: RETAIL_PHARMACY
            sql: |
              SELECT code
              FROM structure_types
              WHERE code = 'RETAIL_PHARMACY'
              LIMIT 1
      changes:
        - update:
            tableName: structure_types
            columns:
              - column:
                  name: parent_type_code
                  valueComputed: NULL
            where: code = 'RETAIL_PHARMACY'