server:
  # FIXME Francesco: Docker forza la porta interna 8080; il default locale resta 8087.
  port: ${SERVER_PORT:8087}

spring:
  datasource:
    # FIXME Francesco: nome DB componibile; in DEV DB_NAME usa lo stesso codice canonico del realm.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME_PREFIX:QTMTenant_}${DB_NAME:${APP_KEYCLOAK_REALM_CODE:QTM}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:dago}}
    driver-class-name: com.mysql.cj.jdbc.Driver

DB_HOST: qtmdev.quicare.com
SPRING_DATASOURCE_USERNAME: root
SPRING_DATASOURCE_PASSWORD: qtm@dev#pwd33
