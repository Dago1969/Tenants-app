spring:
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        '[format_sql]': true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8085/realms/QTM}
  mail:
    host: smtp.gmail.com
    port: 587
    username: francesco.tripodi@gmail.com
    password: ${SPRING_MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
          ssl:
            trust: smtp.gmail.com

logging:
  level:
    root: INFO

# Proprietà custom per configurazione interna QTM (non standard Spring)
qtm:
  dashboard:
    api-base-url: http://localhost:8086/api
  frontend:
    base-url: http://localhost:4201
  otp:
    twilio:
      enabled: ${QTM_OTP_TWILIO_ENABLED:true}
      auto-send-on-onboarding: ${QTM_OTP_TWILIO_AUTO_SEND_ON_ONBOARDING:true}
      base-url: ${QTM_OTP_TWILIO_BASE_URL:https://verify.twilio.com/v2}
      service-sid: ${QTM_OTP_TWILIO_SERVICE_SID:}
      account-sid: ${QTM_OTP_TWILIO_ACCOUNT_SID:}
      auth-token: ${QTM_OTP_TWILIO_AUTH_TOKEN:}
      api-key: ${QTM_OTP_TWILIO_API_KEY:}
      api-secret: ${QTM_OTP_TWILIO_API_SECRET:}
      default-channel: ${QTM_OTP_TWILIO_DEFAULT_CHANNEL:sms}
