spring:
  profiles:
    # FIXME Francesco: profilo selezionabile dall'ENV Docker mantenendo sviluppo come default locale.
    active: ${SPRING_PROFILES_ACTIVE:sviluppo}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    time-zone: UTC
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        '[format_sql]': true
        '[jdbc.time_zone]': UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          # FIXME Francesco: issuer e JWK derivano dalla configurazione Keycloak comune.
          issuer-uri: ${app.keycloak.realm-url}
          jwk-set-uri: ${APP_KEYCLOAK_JWK_SET_URI:${app.keycloak.realm-url}/protocol/openid-connect/certs}
  mail:
    host: smtp.gmail.com
    port: 587
    username: francesco.tripodi@gmail.com
    password: ${SPRING_MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
          ssl:
            trust: smtp.gmail.com

logging:
  level:
    root: INFO

app:
  cors:
    # FIXME Francesco: origini esternalizzate per mantenere gli stessi binari tra locale e DEV.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4207,http://localhost:4200,http://localhost:4201}
  keycloak:
    # FIXME Francesco: server, realm, issuer e JWK devono derivare dalla stessa configurazione Keycloak.
    server-url: ${APP_KEYCLOAK_SERVER_URL:http://localhost:8085}
    realm-code: ${APP_KEYCLOAK_REALM_CODE:QTM}
    realm-url: ${app.keycloak.server-url}/realms/${app.keycloak.realm-code}

# Proprietà custom per configurazione interna QTM (non standard Spring)
qtm:
  # FIXME Francesco: URL pubbliche e interne esternalizzate per il deploy sui domini dedicati.
  dashboard:
    api-base-url: ${QTM_DASHBOARD_API_BASE_URL:http://localhost:8086/api}
    frontend-base-url: ${QTM_DASHBOARD_FRONTEND_BASE_URL:http://localhost:4200}
  frontend:
    base-url: ${QTM_FRONTEND_BASE_URL:http://localhost:4201}
  ticket:
    base-url: ${QTM_TICKET_BASE_URL:http://localhost:8084/api/ticket}
  otp:
    twilio:
      enabled: ${QTM_OTP_TWILIO_ENABLED:true}
      auto-send-on-onboarding: ${QTM_OTP_TWILIO_AUTO_SEND_ON_ONBOARDING:true}
      base-url: ${QTM_OTP_TWILIO_BASE_URL:https://verify.twilio.com/v2}
      service-sid: ${QTM_OTP_TWILIO_SERVICE_SID:}
      account-sid: ${QTM_OTP_TWILIO_ACCOUNT_SID:}
      auth-token: ${QTM_OTP_TWILIO_AUTH_TOKEN:}
      api-key: ${QTM_OTP_TWILIO_API_KEY:}
      api-secret: ${QTM_OTP_TWILIO_API_SECRET:}
      default-channel: ${QTM_OTP_TWILIO_DEFAULT_CHANNEL:sms}
