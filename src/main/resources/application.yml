spring:
  profiles:
    active: collaudo
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    time-zone: UTC
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        '[format_sql]': true
        '[jdbc.time_zone]': UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8085/realms/${APP_KEYCLOAK_REALM_CODE:QTM}}
  mail:
    host: smtp.gmail.com
    port: 587
    username: francesco.tripodi@gmail.com
    password: ${SPRING_MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
          ssl:
            trust: smtp.gmail.com

logging:
  level:
    root: INFO

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4207,http://localhost:4200,http://localhost:4201,https://tenants.qtmdev.quicare.com}
  keycloak:
    base-url: ${APP_KEYCLOAK_SERVER_URL:https://auth.qtmdev.quicare.com}
    realm: ${APP_KEYCLOAK_REALM_CODE:Lecigimon}
    admin-client-id: ${APP_KEYCLOAK_ADMIN_CLIENT_ID:tenants-app-admin}
    admin-client-secret: ${APP_KEYCLOAK_ADMIN_CLIENT_SECRET:}

# Proprietà custom per configurazione interna QTM (non standard Spring)
qtm:
  dashboard:
    api-base-url: http://localhost:8086/api
    frontend-base-url: http://localhost:4200
  frontend:
    base-url: http://localhost:4201
  ticket:
    base-url: ${QTM_TICKET_BASE_URL:http://localhost:8084/api/ticket}
  otp:
    twilio:
      enabled: ${QTM_OTP_TWILIO_ENABLED:true}
      auto-send-on-onboarding: ${QTM_OTP_TWILIO_AUTO_SEND_ON_ONBOARDING:true}
      base-url: ${QTM_OTP_TWILIO_BASE_URL:https://verify.twilio.com/v2}
      service-sid: ${QTM_OTP_TWILIO_SERVICE_SID:}
      account-sid: ${QTM_OTP_TWILIO_ACCOUNT_SID:}
      auth-token: ${QTM_OTP_TWILIO_AUTH_TOKEN:}
      api-key: ${QTM_OTP_TWILIO_API_KEY:}
      api-secret: ${QTM_OTP_TWILIO_API_SECRET:}
      default-channel: ${QTM_OTP_TWILIO_DEFAULT_CHANNEL:sms}

# Keycloak admin client for TENANTS-APP to assign roles automatically
